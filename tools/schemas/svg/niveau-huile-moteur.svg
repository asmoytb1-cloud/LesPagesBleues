<text x="48" y="60" font-family="Inter,Arial" font-size="26" font-weight="850" fill="#10203A">Vérifier le niveau d'huile moteur et faire l'appoint</text>
<text x="48" y="88" font-family="Inter,Arial" font-size="15" fill="#657386">Les Pages Bleues • schéma technique original • illustration de principe</text>
<rect x="48" y="112" width="692" height="500" rx="24" fill="#FBFDFF" stroke="#DDE5EE" stroke-width="2"/>
<text x="78" y="150" font-family="Inter,Arial" font-size="20" font-weight="800" fill="#10203A">Plan technique</text>
<text x="78" y="176" font-family="Inter,Arial" font-size="14" fill="#6A7788">Vue d’ensemble • pièces • zones d’intervention • repères</text>
<g transform="translate(105,95) scale(.72)"><path d="M300 500 C290 410 305 310 370 300 H520 C575 320 590 400 570 500 Z" fill="#D5D9E0" stroke="#596575" stroke-width="8"/><rect x="420" y="330" width="55" height="200" rx="18" fill="#EEF0F3" stroke="#6B7480" stroke-width="8"/><path d="M430 470 H475" stroke="#E89A28" stroke-width="13"/><path d="M445 300 V245 H525 V300" fill="none" stroke="#596575" stroke-width="9"/><line x1="500" y1="270" x2="120" y2="190" stroke="#0B78E3" stroke-width="4" stroke-linecap="round"/><circle cx="500" cy="270" r="9" fill="#fff" stroke="#0B78E3" stroke-width="4"/><circle cx="120" cy="190" r="24" fill="#fff" stroke="#0B78E3" stroke-width="4"/><text x="120" y="197" text-anchor="middle" font-family="Inter,Arial" font-size="20" font-weight="800" fill="#0B78E3">1</text><text x="154" y="197" font-family="Inter,Arial" font-size="20" font-weight="650" fill="#0F1E36">Bouchon</text><line x1="448" y1="430" x2="110" y2="390" stroke="#0B78E3" stroke-width="4" stroke-linecap="round"/><circle cx="448" cy="430" r="9" fill="#fff" stroke="#0B78E3" stroke-width="4"/><circle cx="110" cy="390" r="24" fill="#fff" stroke="#0B78E3" stroke-width="4"/><text x="110" y="397" text-anchor="middle" font-family="Inter,Arial" font-size="20" font-weight="800" fill="#0B78E3">2</text><text x="144" y="397" font-family="Inter,Arial" font-size="20" font-weight="650" fill="#0F1E36">Jauge</text><line x1="460" y1="475" x2="110" y2="530" stroke="#0B78E3" stroke-width="4" stroke-linecap="round"/><circle cx="460" cy="475" r="9" fill="#fff" stroke="#0B78E3" stroke-width="4"/><circle cx="110" cy="530" r="24" fill="#fff" stroke="#0B78E3" stroke-width="4"/><text x="110" y="537" text-anchor="middle" font-family="Inter,Arial" font-size="20" font-weight="800" fill="#0B78E3">3</text><text x="144" y="537" font-family="Inter,Arial" font-size="20" font-weight="650" fill="#0F1E36">Niveau</text></g>
<rect x="770" y="112" width="380" height="500" rx="24" fill="#EAF4FF" stroke="#0B78E355" stroke-width="2"/>
<text x="800" y="150" font-family="Inter,Arial" font-size="20" font-weight="800" fill="#10203A">À garder en tête</text>
<text x="800" y="184" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#4D5B6C">Matériel concerné</text>
<text x="800" y="212" font-family="Inter,Arial,sans-serif" font-size="17px" font-weight="600" fill="#10203A" text-anchor="start"><tspan x="800" dy="0px">Famille d’équipement</tspan></text>
<text x="800" y="285" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#4D5B6C">Outils principaux</text>
<text x="800" y="313" font-family="Inter,Arial,sans-serif" font-size="15px" font-weight="500" fill="#10203A" text-anchor="start"><tspan x="800" dy="0px">Chiffon ou papier absorbant, Entonnoir, Huile</tspan><tspan x="800" dy="18.75px">moteur à la norme du constructeur</tspan></text>
<text x="800" y="403" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#4D5B6C">Consigne de variation</text>
<text x="800" y="431" font-family="Inter,Arial,sans-serif" font-size="15px" font-weight="500" fill="#10203A" text-anchor="start"><tspan x="800" dy="0px">La forme, l’accès et les fixations peuvent</tspan><tspan x="800" dy="18.75px">varier. Vérifier la référence et la notice avant</tspan><tspan x="800" dy="18.75px">une intervention spécifique.</tspan></text>
<rect x="800" y="520" width="315" height="60" rx="18" fill="#0B78E3"/>
<text x="958" y="557" text-anchor="middle" font-family="Inter,Arial" font-size="16" font-weight="800" fill="#fff">SCHÉMA DE PRINCIPE</text>
<text x="48" y="640" font-family="Inter,Arial" font-size="18" font-weight="800" fill="#10203A">Séquence essentielle</text>
<rect x="40" y="650" width="172" height="92" rx="16" fill="#fff" stroke="#D9E0E8" stroke-width="2"/><circle cx="66" cy="677" r="16" fill="#0B78E3"/><text x="66" y="683" text-anchor="middle" font-family="Inter,Arial" font-size="15" font-weight="800" fill="#fff">1</text><text x="89" y="670" font-family="Inter,Arial" font-size="12.5" font-weight="750" fill="#122038"><tspan x="89" dy="0px">Se garer à plat,</tspan><tspan x="89" dy="15px">moteur froid</tspan></text><rect x="232" y="650" width="172" height="92" rx="16" fill="#fff" stroke="#D9E0E8" stroke-width="2"/><circle cx="258" cy="677" r="16" fill="#0B78E3"/><text x="258" y="683" text-anchor="middle" font-family="Inter,Arial" font-size="15" font-weight="800" fill="#fff">2</text><text x="281" y="670" font-family="Inter,Arial" font-size="12.5" font-weight="750" fill="#122038"><tspan x="281" dy="0px">Sortir et essuyer</tspan><tspan x="281" dy="15px">la jauge</tspan></text><rect x="424" y="650" width="172" height="92" rx="16" fill="#fff" stroke="#D9E0E8" stroke-width="2"/><circle cx="450" cy="677" r="16" fill="#0B78E3"/><text x="450" y="683" text-anchor="middle" font-family="Inter,Arial" font-size="15" font-weight="800" fill="#fff">3</text><text x="473" y="670" font-family="Inter,Arial" font-size="12.5" font-weight="750" fill="#122038"><tspan x="473" dy="0px">Mesurer</tspan></text><rect x="616" y="650" width="172" height="92" rx="16" fill="#fff" stroke="#D9E0E8" stroke-width="2"/><circle cx="642" cy="677" r="16" fill="#0B78E3"/><text x="642" y="683" text-anchor="middle" font-family="Inter,Arial" font-size="15" font-weight="800" fill="#fff">4</text><text x="665" y="670" font-family="Inter,Arial" font-size="12.5" font-weight="750" fill="#122038"><tspan x="665" dy="0px">Choisir la bonne</tspan><tspan x="665" dy="15px">huile</tspan></text><rect x="808" y="650" width="172" height="92" rx="16" fill="#fff" stroke="#D9E0E8" stroke-width="2"/><circle cx="834" cy="677" r="16" fill="#0B78E3"/><text x="834" y="683" text-anchor="middle" font-family="Inter,Arial" font-size="15" font-weight="800" fill="#fff">5</text><text x="857" y="670" font-family="Inter,Arial" font-size="12.5" font-weight="750" fill="#122038"><tspan x="857" dy="0px">Faire l'appoint</tspan><tspan x="857" dy="15px">petit à petit</tspan></text><rect x="1000" y="650" width="172" height="92" rx="16" fill="#fff" stroke="#D9E0E8" stroke-width="2"/><circle cx="1026" cy="677" r="16" fill="#0B78E3"/><text x="1026" y="683" text-anchor="middle" font-family="Inter,Arial" font-size="15" font-weight="800" fill="#fff">6</text><text x="1049" y="670" font-family="Inter,Arial" font-size="12.5" font-weight="750" fill="#122038"><tspan x="1049" dy="0px">Refermer</tspan></text>
<text x="48" y="754" font-family="Inter,Arial" font-size="13" fill="#728093">Ne jamais déduire une compatibilité ou une cote à partir de cette illustration seule : la fiche et la documentation constructeur priment.</text>
