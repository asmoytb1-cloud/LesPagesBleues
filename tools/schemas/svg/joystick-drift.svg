<text x="78" y="176" font-family="Inter,Arial" font-size="14" fill="#6A7788">Vue d’ensemble • pièces • zones d’intervention • repères</text>
<g transform="translate(105,95) scale(.72)"><path d="M320 350 Q430 300 540 350 L565 480 Q550 520 510 520 L430 470 L350 520 Q310 520 295 480 Z" fill="#F2F4F6" stroke="#5E6977" stroke-width="8"/>circle cx="355" cy="410" r="20" fill="#39424D"/><circle cx="505" cy="410" r="20" fill="#39424D"/><line x1="355" y1="410" x2="105" y2="220" stroke="#D18A00" stroke-width="4" stroke-linecap="round"/><circle cx="355" cy="410" r="9" fill="#fff" stroke="#D18A00" stroke-width="4"/><circle cx="105" cy="220" r="24" fill="#fff" stroke="#D18A00" stroke-width="4"/><text x="105" y="227" text-anchor="middle" font-family="Inter,Arial" font-size="20" font-weight="800" fill="#D18A00">1</text><text x="139" y="227" font-family="Inter,Arial" font-size="20" font-weight="650" fill="#0F1E36">Stick</text><line x1="505" y1="410" x2="105" y2="520" stroke="#D18A00" stroke-width="4" stroke-linecap="round"/><circle cx="505" cy="410" r="9" fill="#fff" stroke="#D18A00" stroke-width="4"/><circle cx="105" cy="520" r="24" fill="#fff" stroke="#D18A00" stroke-width="4"/><text x="105" y="527" text-anchor="middle" font-family="Inter,Arial" font-size="20" font-weight="800" fill="#D18A00">2</text><text x="139" y="527" font-family="Inter,Arial" font-size="20" font-weight="650" fill="#0F1E36">Boutons</text></g>
<rect x="770" y="112" width="380" height="500" rx="24" fill="#FFF7DE" stroke="#D18A0055" stroke-width="2"/>
