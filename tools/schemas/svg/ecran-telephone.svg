ze="15" font-weight="800" fill="#fff">5</text><text x="857" y="670" font-family="Inter,Arial" font-size="12.5" font-weight="750" fill="#122038"><tspan x="857" dy="0px">Changer l'écran</tspan></text><rect x="1000" y="650" width="172" height="92" rx="16" fill="#fff" stroke="#D9E0E8" stroke-width="2"/><circle cx="1026" cy="677" r="16" fill="#6C5CE7"/><text x="1026" y="683" text-anchor="middle" font-family="Inter,Arial" font-size="15" font-weight="800" fill="#fff">6</text><text x="1049" y="670" font-family="Inter,Arial" font-size="12.5" font-weight="750" fill="#122038"><tspan x="1049" dy="0px">Refermer</tspan></text>
<text x="48" y="754" font-family="Inter,Arial" font-size="13" fill="#728093">Ne jamais déduire une compatibilité ou une cote à partir de cette illustration seule : la fiche et la documentation constructeur priment.</text>
