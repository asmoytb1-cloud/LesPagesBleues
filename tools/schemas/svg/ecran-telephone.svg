<text x="78" y="176" font-family="Inter,Arial" font-size="14" fill="#6A7788">Vue d’ensemble • pièces • zones d’intervention • repères</text>
<g transform="translate(105,95) scale(.72)"><rect x="315" y="210" width="230" height="390" rx="36" fill="#202631" stroke="#4A5667" stroke-width="8"/><rect x="340" y="250" width="180" height="315" rx="14" fill="#EEF3F7"/><rect x="395" y="225" width="70" height="10" rx="5" fill="#7D8793"/><line x1="430" y1="405" x2="110" y2="220" stroke="#6C5CE7" stroke-width="4" stroke-linecap="round"/><circle cx="430" cy="405" r="9" fill="#fff" stroke="#6C5CE7" stroke-width="4"/><circle cx="110" cy="220" r="24" fill="#fff" stroke="#6C5CE7" stroke-width="4"/><text x="110" y="227" text-anchor="middle" font-family="Inter,Arial" font-size="20" font-weight="800" fill="#6C5CE7">1</text><text x="144" y="227" font-family="Inter,Arial" font-size="20" font-weight="650" fill="#0F1E36">Écran</text><line x1="340" y1="500" x2="110" y2="470" stroke="#6C5CE7" stroke-width="4" stroke-linecap="round"/><circle cx="340" cy="500" r="9" fill="#fff" stroke="#6C5CE7" stroke-width="4"/><circle cx="110" cy="470" r="24" fill="#fff" stroke="#6C5CE7" stroke-width="4"/><text x="110" y="477" text-anchor="middle" font-family="Inter,Arial" font-size="20" font-weight="800" fill="#6C5CE7">2</text><text x="144" y="477" font-family="Inter,Arial" font-size="20" font-weight="650" fill="#0F1E36">Châssis</text></g>
