<text x="78" y="150" font-family="Inter,Arial" font-size="20" font-weight="800" fill="#10203A">Plan technique</text>
<text x="78" y="176" font-family="Inter,Arial" font-size="14" fill="#6A7788">Vue d’ensemble • pièces • zones d’intervention • repères</text>
<g transform="translate(105,95) scale(.72)"><rect x="270" y="225" width="320" height="410" rx="25" fill="#E4E8EE" stroke="#5D6A79" stroke-width="9"/><rect x="305" y="270" width="250" height="36" rx="10" fill="#CAD1DA"/><circle cx="430" cy="445" r="110" fill="#F8FAFC" stroke="#667384" stroke-width="10"/><circle cx="430" cy="445" r="76" fill="#D5DAE1" stroke="#8691A0" stroke-width="7"/><path d="M315 475 Q430 560 545 475" fill="none" stroke="#A5AFBA" stroke-width="10"/><line x1="430" y1="445" x2="100" y2="235" stroke="#0A9A77" stroke-width="4" stroke-linecap="round"/><circle cx="430" cy="445" r="9" fill="#fff" stroke="#0A9A77" stroke-width="4"/><circle cx="100" cy="235" r="24" fill="#fff" stroke="#0A9A77" stroke-width="4"/><text x="100" y="242" text-anchor="middle" font-family="Inter,Arial" font-size="20" font-weight="800" fill="#0A9A77">1</text><text x="134" y="242" font-family="Inter,Arial" font-size="20" font-weight="650" fill="#0F1E36">Tambour</text><line x1="305" y1="540" x2="110" y2="360" stroke="#0A9A77" stroke-width="4" stroke-linecap="round"/><circle cx="305" cy="540" r="9" fill="#fff" stroke="#0A9A77" stroke-width="4"/><circle cx="110" cy="360" r="24" fill="#fff" stroke="#0A9A77" stroke-width="4"/><text x="110" y="367" text-anchor="middle" font-family="Inter,Arial" font-size="20" font-weight="800" fill="#0A9A77">2</text><text x="144" y="367" font-family="Inter,Arial" font-size="20" font-weight="650" fill="#0F1E36">Joint</text><line x1="550" y1="290" x2="110" y2="500" stroke="#0A9A77" stroke-width="4" stroke-linecap="round"/><circle cx="550" cy="290" r="9" fill="#fff" stroke="#0A9A77" stroke-width="4"/><circle cx="110" cy="500" r="24" fill="#fff" stroke="#0A9A77" stroke-width="4"/><text x="110" y="507" text-anchor="middle" font-family="Inter,Arial" font-size="20" font-weight="800" fill="#0A9A77">3</text><text x="144" y="507" font-family="Inter,Arial" font-size="20" font-weight="650" fill="#0F1E36">Façade</text></g>
<rect x="770" y="112" width="380" height="500" rx="24" fill="#EAFBF6" stroke="#0A9A7755" stroke-width="2"/>
<text x="800" y="150" font-family="Inter,Arial" font-size="20" font-weight="800" fill="#10203A">À garder en tête</text>
<text x="800" y="184" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#4D5B6C">Matériel concerné</text>
<text x="800" y="212" font-family="Inter,Arial,sans-serif" font-size="17px" font-weight="600" fill="#10203A" text-anchor="start"><tspan x="800" dy="0px">lave-linge</tspan></text>
<text x="800" y="285" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#4D5B6C">Outils principaux</text>
<text x="800" y="313" font-family="Inter,Arial,sans-serif" font-size="15px" font-weight="500" fill="#10203A" text-anchor="start"><tspan x="800" dy="0px">Une lampe ou un autre appareil pour tester la</tspan><tspan x="800" dy="18.75px">prise</tspan></text>
<text x="800" y="403" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#4D5B6C">Consigne de variation</text>
<text x="800" y="431" font-family="Inter,Arial,sans-serif" font-size="15px" font-weight="500" fill="#10203A" text-anchor="start"><tspan x="800" dy="0px">La forme, l’accès et les fixations peuvent</tspan><tspan x="800" dy="18.75px">varier. Vérifier la référence et la notice avant</tspan><tspan x="800" dy="18.75px">une intervention spécifique.</tspan></text>
<rect x="800" y="520" width="315" height="60" rx="18" fill="#0A9A77"/>
<text x="958" y="557" text-anchor="middle" font-family="Inter,Arial" font-size="16" font-weight="800" fill="#fff">SCHÉMA DE PRINCIPE</text>
<text x="48" y="640" font-family="Inter,Arial" font-size="18" font-weight="800" fill="#10203A">Séquence essentielle</text>
<rect x="40" y="650" width="172" height="92" rx="16" fill="#fff" stroke="#D9E0E8" stroke-width="2"/><circle cx="66" cy="677" r="16" fill="#0A9A77"/><text x="66" y="683" text-anchor="middle" font-family="Inter,Arial" font-size="15" font-weight="800" fill="#fff">1</text><text x="89" y="670" font-family="Inter,Arial" font-size="12.5" font-weight="750" fill="#122038"><tspan x="89" dy="0px">Tester la prise</tspan></text><rect x="232" y="650" width="172" height="92" rx="16" fill="#fff" stroke="#D9E0E8" stroke-width="2"/><circle cx="258" cy="677" r="16" fill="#0A9A77"/><text x="258" y="683" text-anchor="middle" font-family="Inter,Arial" font-size="15" font-weight="800" fill="#fff">2</text><text x="281" y="670" font-family="Inter,Arial" font-size="12.5" font-weight="750" fill="#122038"><tspan x="281" dy="0px">Vérifier le</tspan><tspan x="281" dy="15px">tableau électrique</tspan></text><rect x="424" y="650" width="172" height="92" rx="16" fill="#fff" stroke="#D9E0E8" stroke-width="2"/><circle cx="450" cy="677" r="16" fill="#0A9A77"/><text x="450" y="683" text-anchor="middle" font-family="Inter,Arial" font-size="15" font-weight="800" fill="#fff">3</text><text x="473" y="670" font-family="Inter,Arial" font-size="12.5" font-weight="750" fill="#122038"><tspan x="473" dy="0px">Bien fermer la</tspan><tspan x="473" dy="15px">porte</tspan></text><rect x="616" y="650" width="172" height="92" rx="16" fill="#fff" stroke="#D9E0E8" stroke-width="2"/><circle cx="642" cy="677" r="16" fill="#0A9A77"/><text x="642" y="683" text-anchor="middle" font-family="Inter,Arial" font-size="15" font-weight="800" fill="#fff">4</text><text x="665" y="670" font-family="Inter,Arial" font-size="12.5" font-weight="750" fill="#122038"><tspan x="665" dy="0px">Désactiver la</tspan><tspan x="665" dy="15px">sécurité enfant</tspan></text><rect x="808" y="650" width="172" height="92" rx="16" fill="#fff" stroke="#D9E0E8" stroke-width="2"/><circle cx="834" cy="677" r="16" fill="#0A9A77"/><text x="834" y="683" text-anchor="middle" font-family="Inter,Arial" font-size="15" font-weight="800" fill="#fff">5</text><text x="857" y="670" font-family="Inter,Arial" font-size="12.5" font-weight="750" fill="#122038"><tspan x="857" dy="0px">Relancer un</tspan><tspan x="857" dy="15px">programme</tspan></text>
<text x="48" y="754" font-family="Inter,Arial" font-size="13" fill="#728093">Ne jamais déduire une compatibilité ou une cote à partir de cette illustration seule : la fiche et la documentation constructeur priment.</text>
