<text x="78" y="150" font-family="Inter,Arial" font-size="20" font-weight="800" fill="#10203A">Plan technique</text>
<text x="78" y="176" font-family="Inter,Arial" font-size="14" fill="#6A7788">Vue d’ensemble • pièces • zones d’intervention • repères</text>
<g transform="translate(105,95) scale(.72)"><rect x="250" y="290" width="380" height="240" rx="28" fill="#2E3238" stroke="#10151C" stroke-width="8"/><rect x="330" y="245" width="90" height="55" rx="10" fill="#1B1F24"/><rect x="470" y="245" width="90" height="55" rx="10" fill="#1B1F24"/><circle cx="375" cy="270" r="13" fill="#D73737"/><circle cx="515" cy="270" r="13" fill="#2B6DE0"/><path d="M265 330 H615 M265 390 H615 M265 450 H615" stroke="#606975" stroke-width="5"/><line x1="375" y1="270" x2="120" y2="200" stroke="#0B78E3" stroke-width="4" stroke-linecap="round"/><circle cx="375" cy="270" r="9" fill="#fff" stroke="#0B78E3" stroke-width="4"/><circle cx="120" cy="200" r="24" fill="#fff" stroke="#0B78E3" stroke-width="4"/><text x="120" y="207" text-anchor="middle" font-family="Inter,Arial" font-size="20" font-weight="800" fill="#0B78E3">1</text><text x="154" y="207" font-family="Inter,Arial" font-size="20" font-weight="650" fill="#0F1E36">Borne +</text><line x1="515" y1="270" x2="115" y2="290" stroke="#0B78E3" stroke-width="4" stroke-linecap="round"/><circle cx="515" cy="270" r="9" fill="#fff" stroke="#0B78E3" stroke-width="4"/><circle cx="115" cy="290" r="24" fill="#fff" stroke="#0B78E3" stroke-width="4"/><text x="115" y="297" text-anchor="middle" font-family="Inter,Arial" font-size="20" font-weight="800" fill="#0B78E3">2</text><text x="149" y="297" font-family="Inter,Arial" font-size="20" font-weight="650" fill="#0F1E36">Borne –</text><line x1="440" y1="410" x2="130" y2="500" stroke="#0B78E3" stroke-width="4" stroke-linecap="round"/><circle cx="440" cy="410" r="9" fill="#fff" stroke="#0B78E3" stroke-width="4"/><circle cx="130" cy="500" r="24" fill="#fff" stroke="#0B78E3" stroke-width="4"/><text x="130" y="507" text-anchor="middle" font-family="Inter,Arial" font-size="20" font-weight="800" fill="#0B78E3">3</text><text x="164" y="507" font-family="Inter,Arial" font-size="20" font-weight="650" fill="#0F1E36">Batterie</text></g>
<rect x="770" y="112" width="380" height="500" rx="24" fill="#EAF4FF" stroke="#0B78E355" stroke-width="2"/>
<text x="800" y="150" font-family="Inter,Arial" font-size="20" font-weight="800" fill="#10203A">À garder en tête</text>
<text x="800" y="184" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#4D5B6C">Matériel concerné</text>
<text x="800" y="212" font-family="Inter,Arial,sans-serif" font-size="17px" font-weight="600" fill="#10203A" text-anchor="start"><tspan x="800" dy="0px">Famille d’équipement</tspan></text>
<text x="800" y="285" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#4D5B6C">Outils principaux</text>
<text x="800" y="313" font-family="Inter,Arial,sans-serif" font-size="15px" font-weight="500" fill="#10203A" text-anchor="start"><tspan x="800" dy="0px">Gants et lunettes, Clé plate ou à douille</tspan><tspan x="800" dy="18.75px">(souvent 10 mm), Brosse métallique, Chiffon</tspan></text>
<text x="800" y="403" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#4D5B6C">Consigne de variation</text>
<text x="800" y="431" font-family="Inter,Arial,sans-serif" font-size="15px" font-weight="500" fill="#10203A" text-anchor="start"><tspan x="800" dy="0px">La forme, l’accès et les fixations peuvent</tspan><tspan x="800" dy="18.75px">varier. Vérifier la référence et la notice avant</tspan><tspan x="800" dy="18.75px">une intervention spécifique.</tspan></text>
<rect x="800" y="520" width="315" height="60" rx="18" fill="#0B78E3"/>
<text x="958" y="557" text-anchor="middle" font-family="Inter,Arial" font-size="16" font-weight="800" fill="#fff">SCHÉMA DE PRINCIPE</text>
<text x="48" y="640" font-family="Inter,Arial" font-size="18" font-weight="800" fill="#10203A">Séquence essentielle</text>
