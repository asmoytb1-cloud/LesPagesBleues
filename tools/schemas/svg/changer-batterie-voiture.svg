<text x="48" y="60" font-family="Inter,Arial" font-size="26" font-weight="850" fill="#10203A">Changer la batterie d'une voiture</text>
<text x="48" y="88" font-family="Inter,Arial" font-size="15" fill="#657386">Les Pages Bleues • schéma technique original • illustration de principe</text>
