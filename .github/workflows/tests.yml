name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Pages générées à jour
        run: |
          npm run build
          git diff --exit-code -- fiches categories sitemap.xml robots.txt || (echo "Lancez « npm run build » et committez les fichiers générés." && exit 1)
      - run: npm run validate
      - run: npm run test:e2e
